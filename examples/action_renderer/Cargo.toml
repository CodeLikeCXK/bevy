[package]
name = "action_renderer"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"
description = "Standalone hybrid Meshlet + Irradiance Volume renderer base for a character action game"

[dependencies]
bevy = { path = "../../", features = ["meshlet", "free_camera"] }
clap = { version = "4.0", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
